<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1640px; height: 624px; display: flex; align-items: center; justify-content: space-between; padding: 0 110px; gap: 80px; }
  .left { display: grid; gap: 28px; max-width: 780px; }
  .brand img { width: 72px; height: 72px; }
  .brand span { font-size: 58px; }
  h1 { font-family: var(--font-heading); font-weight: 700; font-size: 52px; line-height: 1.15; }
  p { font-size: 30px; color: var(--text-muted); line-height: 1.45; }
  .notif { width: 560px; }
  .notif__badge { font-size: 22px; }
  .notif__title { font-size: 32px; }
  .notif__price { font-size: 28px; }
  .notif__meta { font-size: 24px; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="../../../public/logo.svg" alt=""><span>DropWatch</span></div>
    <h1>One exact alert at one exact price.</h1>
    <p>No feed, no coupon clutter, no daily "hot deals" email. You hear from us when your price hits — and never otherwise.</p>
  </div>
  <div class="notif">
    <div class="notif__badge">PRICE DROP</div>
    <div class="notif__title">Sony WH-1000XM5</div>
    <div class="notif__price"><strong>$248.00</strong> at Best Buy · was $348.00</div>
    <div class="notif__meta">Your target was $250.</div>
  </div>
</body>
</html>
