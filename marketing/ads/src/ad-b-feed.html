<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1080px; display: grid; grid-template-rows: auto 1fr auto; padding: 72px 84px; }
  .middle { display: grid; align-content: center; gap: 48px; }
  .bubble { background: var(--surface); border: 2px solid var(--border); border-radius: 28px 28px 28px 8px; padding: 44px 52px; font-size: 44px; line-height: 1.4; max-width: 860px; }
  .caret { display: inline-block; width: 4px; height: 46px; background: var(--text-primary); vertical-align: -8px; margin-left: 6px; }
  h1 { font-family: var(--font-heading); font-weight: 700; font-size: 72px; line-height: 1.15; text-wrap: balance; }
  p { font-size: 36px; color: var(--text-muted); line-height: 1.5; max-width: 800px; }
</style>
</head>
<body>
  <div class="brand"><img src="../../../public/logo.svg" alt=""><span>DropWatch</span></div>
  <div class="middle">
    <div class="bubble">AirPods Pro under $200<span class="caret"></span></div>
    <h1>That's the whole setup.</h1>
    <p>Type it like you'd text a friend. Get one alert when it drops — nothing else, ever.</p>
  </div>
  <div class="cta-pill">Get early access — 3 months of Pro free</div>
</body>
</html>
