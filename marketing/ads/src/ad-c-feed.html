<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1080px; display: grid; grid-template-rows: auto 1fr auto; padding: 72px 84px; }
  .middle { display: grid; align-content: center; gap: 52px; }
  .noise { display: grid; gap: 18px; }
  .noise div { font-size: 34px; color: var(--text-muted); text-decoration: line-through; text-decoration-thickness: 3px; }
  .noise div:nth-child(2) { opacity: 0.75; }
  .noise div:nth-child(3) { opacity: 0.5; }
  h1 { font-family: var(--font-heading); font-weight: 700; font-size: 76px; line-height: 1.12; text-wrap: balance; }
  p { font-size: 36px; color: var(--text-muted); line-height: 1.5; max-width: 820px; }
</style>
</head>
<body>
  <div class="brand"><img src="../../../public/logo.svg" alt=""><span>DropWatch</span></div>
  <div class="middle">
    <div class="noise">
      <div>40 HOT DEALS you can't miss today</div>
      <div>FLASH SALE ends tonight!!</div>
      <div>Deals we think you'll love…</div>
    </div>
    <h1>You didn't want 40 deals. You wanted one.</h1>
    <p>DropWatch watches one exact thing at one exact price — and only speaks when it drops.</p>
  </div>
  <div class="cta-pill">Get early access — 3 months of Pro free</div>
</body>
</html>
