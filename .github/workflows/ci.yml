name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The landing page and the app are independent builds with different package
# managers, so they run as separate jobs rather than one combined install.
jobs:
  landing-page:
    name: Landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Assert the landing bundle is served from the site root
        # The Vercel project that serves usedropwatch.com builds this root, so a
        # non-root base would break every live ad and share-kit link.
        run: |
          grep -q 'src="/assets/' dist/index.html
          grep -q 'href="/assets/' dist/index.html

  app:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          # >=22.19.0: undici@8, pulled in by jsdom@30, declares it in engines
          # and throws "webidl.util.markAsUncloneable is not a function" below it.
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check

      - name: Test
        # KNOWN GAP: no DATABASE_URL, so the six integration suites (9 tests)
        # skip rather than run. A MySQL service container was attempted twice
        # and both times the job hung on "Initialize containers" past the
        # timeout, with the landing-page job on the same run finishing in 20s —
        # service containers do not start in this environment. Revisit with
        # ADR-2 (Supabase Postgres), where the database is managed rather than
        # a sidecar. Everything else must pass with no ambient credentials.
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Assert build-time instrumentation stays out of the bundle
        # The Manus runtime previously inlined ~367 kB into the production HTML.
        run: |
          if grep -q 'manus-runtime' dist/public/index.html; then
            echo "manus-runtime was inlined into the production build" >&2
            exit 1
          fi
