name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The landing page and the app are independent builds with different package
# managers, so they run as separate jobs rather than one combined install.
jobs:
  landing-page:
    name: Landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Assert the landing bundle is served from the site root
        # The Vercel project that serves usedropwatch.com builds this root, so a
        # non-root base would break every live ad and share-kit link.
        run: |
          grep -q 'src="/assets/' dist/index.html
          grep -q 'href="/assets/' dist/index.html

  app:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The integration suites skip themselves without DATABASE_URL, so without a
    # database they were dead weight in CI. This runs them for real.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dropwatch
          MYSQL_DATABASE: dropwatch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdropwatch"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:dropwatch@127.0.0.1:3306/dropwatch_test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          # >=22.19.0: undici@8, pulled in by jsdom@30, declares it in engines
          # and throws "webidl.util.markAsUncloneable is not a function" below it.
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Apply migrations to the test database
        # migrate only — `generate` would author a new migration from the schema.
        run: pnpm exec drizzle-kit migrate

      - name: Test
        # DATABASE_URL is set above, so the integration suites run rather than
        # skip. No other credentials are provided: everything else must pass
        # without them. The suites skip themselves when DATABASE_URL is absent,
        # which would let a broken database look like a green build — so a
        # skipped integration suite fails the job.
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log
          if grep -qE "^ *↓ .*integration" /tmp/test.log; then
            echo "::error::integration suites skipped despite DATABASE_URL being set" >&2
            exit 1
          fi
      - name: Build
        run: pnpm run build
      - name: Assert build-time instrumentation stays out of the bundle
        # The Manus runtime previously inlined ~367 kB into the production HTML.
        run: |
          if grep -q 'manus-runtime' dist/public/index.html; then
            echo "manus-runtime was inlined into the production build" >&2
            exit 1
          fi
